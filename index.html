<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Invitation for Chuti ✨</title>
    <style>
        :root {
            --primary-pink: #ff4d6d;
            --secondary-pink: #ff758f;
            --dark-bg: #0f051d;
            --card-bg: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 77, 109, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(199, 125, 255, 0.15) 0%, transparent 40%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            padding: 20px 10px;
        }

        /* Background Effects */
        .stars-container, .ambient-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .ambient-heart {
            position: absolute;
            color: rgba(255, 117, 143, 0.25);
            font-size: var(--size);
            left: var(--left);
            bottom: -50px;
            animation: floatUp var(--duration) linear infinite;
            animation-delay: var(--delay);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
        }

        /* Invitation Card */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 28px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            text-align: center;
            position: relative;
            z-index: 10;
            animation: cardAppear 1s cubic-bezier(0.17, 0.67, 0.83, 0.67);
            transition: opacity 1s ease, filter 1s ease, transform 1s ease;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: scale(0.9) translateY(40px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Smooth 5-Second Burning Fire Sequence */
        .card-burn {
            animation: slowBurn 5s forwards linear;
        }

        @keyframes slowBurn {
            0% {
                filter: drop-shadow(0 0 10px #ff3300) brightness(1);
                box-shadow: 0 0 20px #ff4500;
            }
            25% {
                filter: drop-shadow(0 -20px 30px #ff0000) brightness(1.3) contrast(1.5);
                box-shadow: inset 0 -100px 80px rgba(255, 69, 0, 0.8), 0 0 40px #ff0000;
                transform: scale(0.98) rotate(1deg);
            }
            50% {
                filter: drop-shadow(0 -30px 50px #ff6600) brightness(1.6) contrast(2);
                box-shadow: inset 0 -200px 100px rgba(255, 0, 0, 0.9), 0 0 60px #ff4500;
                transform: scale(0.95) rotate(-1.5deg);
                opacity: 0.8;
            }
            75% {
                filter: drop-shadow(0 -40px 60px #ffaa00) brightness(0.6) contrast(2.5);
                box-shadow: inset 0 -350px 120px rgba(0, 0, 0, 0.95), 0 0 40px #ff0000;
                transform: scale(0.9) translateY(20px) rotate(2deg);
                opacity: 0.4;
            }
            100% {
                filter: brightness(0);
                box-shadow: 0 0 0 transparent;
                transform: scale(0.8) translateY(60px);
                opacity: 0;
            }
        }

        .badge {
            display: inline-block;
            background: rgba(255, 77, 109, 0.2);
            color: #ff8fa3;
            border: 1px solid rgba(255, 77, 109, 0.4);
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            font-weight: 600;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #ffffff, #ffb3c1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info-container {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 22px;
            text-align: left;
            margin-bottom: 25px;
        }

        .info-row {
            display: flex;
            align-items: center;
            margin-bottom: 14px;
            font-size: 0.95rem;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .icon {
            font-size: 1.4rem;
            margin-right: 14px;
            width: 30px;
            text-align: center;
        }

        .game-plan {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed rgba(255, 255, 255, 0.15);
        }

        .plan-header {
            font-weight: 600;
            color: #ff8fa3;
            margin-bottom: 8px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .plan-step {
            font-size: 0.9rem;
            color: #d0d0d0;
            margin-left: 10px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
        }

        .plan-step::before {
            content: "•";
            color: var(--secondary-pink);
            font-weight: bold;
            margin-right: 8px;
        }

        /* Action Buttons */
        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-top: 25px;
            position: relative;
            min-height: 60px;
            z-index: 20;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff4d6d, #ff758f);
            color: #fff;
            box-shadow: 0 8px 25px rgba(255, 77, 109, 0.5);
            z-index: 2;
        }

        .btn-yes:hover {
            box-shadow: 0 12px 30px rgba(255, 77, 109, 0.7);
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.12);
            color: #bbb;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 1;
        }

        /* Kiss Pop-Up Overlay */
        .popup-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 350;
            text-align: center;
            pointer-events: none;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.8s ease;
        }

        .popup-display.active {
            transform: translate(-50%, -50%) scale(1);
        }

        @keyframes pulseSymbol {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Animation Layer (Rain / Sparks) */
        .overlay-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }

        .falling-element {
            position: absolute;
            top: -60px;
            animation: fallDown var(--speed) linear forwards;
        }

        @keyframes fallDown {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        /* Pure Black Fade Background */
        .blackout-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-in-out;
        }

        .blackout-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Final Thank You Card */
        .thank-you-card {
            position: fixed;
            bottom: -250px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 28px;
            padding: 40px 50px;
            text-align: center;
            color: #ffffff;
            font-size: 2rem;
            font-weight: bold;
            box-shadow: 0 20px 60px rgba(255, 77, 109, 0.3);
            z-index: 400;
            opacity: 0;
            transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1);
            white-space: nowrap;
        }

        .thank-you-card.center-active {
            bottom: 50%;
            transform: translate(-50%, 50%);
            opacity: 1;
        }

        .status-text {
            margin-top: 18px;
            font-size: 0.85rem;
            color: #ff8fa3;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <!-- Background Elements -->
    <div class="stars-container" id="starsContainer"></div>
    <div class="ambient-hearts" id="ambientHearts"></div>

    <!-- Main Card -->
    <div class="card" id="inviteCard">
        <span class="badge">Official Invitation</span>
        <h1>For: Chuti ❤️</h1>

        <div class="info-container">
            <div class="info-row">
                <span class="icon">🧺</span>
                <span><strong>Event:</strong> Picnic & Lunch</span>
            </div>
            <div class="info-row">
                <span class="icon">📍</span>
                <span><strong>Location:</strong> Negombo</span>
            </div>
            <div class="info-row">
                <span class="icon">📅</span>
                <span><strong>When:</strong> Nov 4th | 10:30 AM – 2:30 PM</span>
            </div>

            <div class="game-plan">
                <div class="plan-header">The Game Plan</div>
                <div class="plan-step">Relaxing outdoor picnic</div>
                <div class="plan-step">Lunch at a great spot</div>
                <div class="plan-step">Heading back home together</div>
            </div>
        </div>

        <p style="font-size: 0.95rem; color: #e0e0e0; font-weight: 500;">Will you come with me?</p>

        <div class="btn-container">
            <button class="btn btn-yes" id="yesBtn" onclick="onAccept()">YES! ✨</button>
            <button class="btn btn-no" id="noBtn" onclick="onDecline()">NO 💔</button>
        </div>

        <div class="status-text" id="statusText"></div>
    </div>

    <!-- Kiss Display -->
    <div class="popup-display" id="popupDisplay"></div>

    <!-- Animation Layer -->
    <div class="overlay-layer" id="overlayLayer"></div>

    <!-- Black Background Transition -->
    <div class="blackout-screen" id="blackoutScreen"></div>

    <!-- Final Display Card -->
    <div class="thank-you-card" id="thankYouCard">
        Thank You A Lot! ❤️✨
    </div>

    <script>
        const FORMSPREE_ENDPOINT = 'https://formspree.io/f/mdekbvzn';

        // Stars Generation
        const starsContainer = document.getElementById('starsContainer');
        for (let i = 0; i < 60; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = `${Math.random() * 3 + 1}px`;
            star.style.height = star.style.width;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
            starsContainer.appendChild(star);
        }

        // Ambient Background Hearts
        const ambientHearts = document.getElementById('ambientHearts');
        const heartSymbols = ['❤️', '💖', '✨', '💕'];
        for (let i = 0; i < 18; i++) {
            const heart = document.createElement('div');
            heart.className = 'ambient-heart';
            heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.setProperty('--size', `${Math.random() * 16 + 12}px`);
            heart.style.setProperty('--left', `${Math.random() * 100}%`);
            heart.style.setProperty('--duration', `${Math.random() * 8 + 6}s`);
            heart.style.setProperty('--delay', `${Math.random() * 5}s`);
            ambientHearts.appendChild(heart);
        }

        let isSubmitted = false;

        // "NO" Button Event Handler
        async function onDecline() {
            if (isSubmitted) return;
            isSubmitted = true;

            const card = document.getElementById('inviteCard');
            card.classList.add('card-burn');

            startFireParticles();

            try {
                fetch(FORMSPREE_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        Response: 'NO (Declined - Card Burned to Ashes 💔)',
                        Name: 'Chuti',
                        Event: 'Picnic & Lunch in Negombo'
                    })
                });
            } catch (err) {
                console.error(err);
            }

            setTimeout(() => {
                window.close();
            }, 5000);
        }

        function startFireParticles() {
            const container = document.getElementById('overlayLayer');
            const fireSymbols = ['🔥', '💥', '✨', '💨'];
            const interval = setInterval(() => {
                const el = document.createElement('div');
                el.className = 'falling-element';
                el.innerText = fireSymbols[Math.floor(Math.random() * fireSymbols.length)];
                el.style.left = `${Math.random() * 60 + 20}%`;
                el.style.fontSize = `${Math.random() * 20 + 15}px`;
                el.style.setProperty('--speed', `${Math.random() * 2 + 1.5}s`);
                container.appendChild(el);

                setTimeout(() => el.remove(), 3500);
            }, 100);

            setTimeout(() => clearInterval(interval), 4800);
        }

        // "YES" Button Event Handler
        async function onAccept() {
            if (isSubmitted) return;
            isSubmitted = true;

            document.getElementById('statusText').innerText = "Sending response...";

            startRain(['❤️', '💖', '✨', '💕', '🌸'], 120);

            const popup = document.getElementById('popupDisplay');
            if (popup) {
                popup.innerHTML = `
                    <div style="font-size: 110px; filter: drop-shadow(0 0 30px rgba(255, 105, 180, 0.8)); animation: pulseSymbol 1.5s infinite ease-in-out;">💋</div>
                    <div style="font-size: 1.5rem; font-weight: 700; color: #ff758f; margin-top: 15px; text-shadow: 0 0 15px rgba(255, 105, 180, 0.6);">Yay! Can't wait! 😘</div>
                `;
                popup.classList.add('active');
            }

            document.getElementById('blackoutScreen').classList.add('active');

            try {
                await fetch(FORMSPREE_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        Response: 'YES! She accepted the invitation! ❤️',
                        Name: 'Chuti',
                        Event: 'Picnic & Lunch in Negombo',
                        Date: 'November 4th (10:30 AM - 2:30 PM)'
                    })
                });
            } catch (err) {
                console.error(err);
            }

            setTimeout(() => {
                popup.style.opacity = '0';
                
                setTimeout(() => {
                    document.getElementById('thankYouCard').classList.add('center-active');
                }, 300);
            }, 1800);
        }

        function startRain(itemsArray, intervalMs) {
            const container = document.getElementById('overlayLayer');
            setInterval(() => {
                const el = document.createElement('div');
                el.className = 'falling-element';
                el.innerText = itemsArray[Math.floor(Math.random() * itemsArray.length)];
                el.style.left = `${Math.random() * 100}%`;
                el.style.fontSize = `${Math.random() * 22 + 20}px`;
                el.style.setProperty('--speed', `${Math.random() * 2 + 2}s`);
                container.appendChild(el);

                setTimeout(() => el.remove(), 4000);
            }, intervalMs);
        }
    </script>
</body>
</html>
